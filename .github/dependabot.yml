version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    groups: { android: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /decky
    schedule: { interval: monthly }
    groups: { decky: { patterns: ["*"] } }
