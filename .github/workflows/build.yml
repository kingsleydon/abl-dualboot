name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ABL_VERSION: v1.2
  ABL_TARBALL_SHA256: 64034fb076ea0bb858beaa2f29dbef635e97d29f3e3d32c13bce61bd4af4cff7

jobs:
  abl:
    runs-on: ubuntu-24.04
    steps:
      - name: Download ROCKNIX ABL (official release, checksum pinned)
        run: |
          curl -fsSL -o abl.tar.gz "https://github.com/ROCKNIX/abl/releases/download/$ABL_VERSION/rocknix-abl-$ABL_VERSION.tar.gz"
          echo "$ABL_TARBALL_SHA256  abl.tar.gz" | sha256sum -c
          tar -xzf abl.tar.gz
          mkdir abl && cp rocknix-abl-$ABL_VERSION/*.elf rocknix-abl-$ABL_VERSION/*.sha256 abl/
          (cd abl && sha256sum -c *.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: abl
          path: abl/

  android:
    needs: abl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: abl
          path: android/app/abl-assets/abl
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1
      - name: Decode signing key
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.event_name != 'pull_request' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle :app:assembleRelease --no-daemon
          mkdir -p ../out && cp app/build/outputs/apk/release/*.apk ../out/BootSwitch.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/

  packages:
    needs: abl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: abl
          path: abl
      - name: Magisk / KernelSU / APatch modules
        run: |
          mkdir -p out
          pack() { (cd "$1" && cp -r ../_magisk/META-INF . && zip -rX "../../out/$2" .); }
          cp shared/bootswitch.sh modules/boot-to-linux/
          pack modules/boot-to-linux boot-to-linux-module.zip
          cp shared/abl.sh modules/abl-reflash/ && cp -r abl modules/abl-reflash/abl
          pack modules/abl-reflash rocknix-abl-reflash-module.zip
      - name: Decky plugin
        run: |
          mkdir -p pkg/boot-switch && cp -r decky/. pkg/boot-switch/ && cp linux/bootswitch.py pkg/boot-switch/
          (cd pkg && zip -rX ../out/boot-switch-decky.zip boot-switch)
      - name: Linux scripts
        run: |
          (cd linux && zip -X ../out/bootswitch-linux.zip bootswitch.py reboot-to-android.desktop)
          cp linux/install.sh out/install-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{android,packages}"
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
