name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name=${GITHUB_REF_NAME#v}
            IFS=. read -r major minor patch <<< "$name"
            code=$((major * 10000 + minor * 100 + patch))
          else
            name="0.0.0-dev.$GITHUB_RUN_NUMBER"; code=$GITHUB_RUN_NUMBER
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "code=$code" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode signing key
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.event_name != 'pull_request' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease
          mkdir -p ../out && cp app/build/outputs/apk/release/*.apk ../out/ABL-Dual-Boot.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/

  decky:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: decky/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: decky/pnpm-lock.yaml
      - name: Build plugin
        working-directory: decky
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Package (decky-plugin-template layout)
        run: |
          P=pkg/abl-dualboot; mkdir -p $P/dist
          cp decky/dist/index.js $P/dist/
          cp decky/plugin.json decky/main.py decky/LICENSE linux/dualboot.py $P/
          # Decky shows and compares the package.json version, so it must match the release tag
          jq --arg v "$VERSION_NAME" '.version = $v' decky/package.json > $P/package.json
          mkdir -p out && (cd pkg && zip -rX ../out/abl-dualboot-decky.zip abl-dualboot)
      - uses: actions/upload-artifact@v7
        with:
          name: decky
          path: out/

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux scripts
        run: |
          mkdir -p out
          (cd linux && zip -X ../out/abl-dualboot-linux.zip dualboot.py reboot-to-android.desktop)
          cp linux/install.sh out/install-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, decky, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "{android,decky,linux}"
          path: out
          merge-multiple: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes = this version's section of CHANGELOG.md
          awk -v v="## $GITHUB_REF_NAME" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $GITHUB_REF_NAME' section"; exit 1; }
          gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --notes-file notes.md
